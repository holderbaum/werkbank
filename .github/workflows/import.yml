name: import
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Grundgeruest schreiben, pruefen, committen
        run: |
          mkdir -p bin test tools werkbank/de/Werkbank/Regeln werkbank/de/Werkbank/Rollen/Sparringpartner werkbank/de/Werkbank/Workflows
          cat > package.json <<'__WB_EOF__'
          {
            "name": "holderbaum-werkbank",
            "version": "0.1.0",
            "description": "Richtet eine Werkbank ein: ein strukturiertes Verzeichnis, in dem ein Mensch mit KI-Agenten arbeitet.",
            "bin": {
              "holderbaum-werkbank": "bin/holderbaum-werkbank.js"
            },
            "files": [
              "bin",
              "werkbank"
            ],
            "scripts": {
              "test": "node test/smoke.js"
            },
            "engines": {
              "node": ">=18"
            },
            "keywords": ["werkbank", "claude", "cowork", "ki", "agent"],
            "author": "Jakob Holderbaum",
            "license": "MIT",
            "homepage": "https://github.com/holderbaum/werkbank",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/holderbaum/werkbank.git"
            },
            "bugs": {
              "url": "https://github.com/holderbaum/werkbank/issues"
            }
          }
          __WB_EOF__
          cat > bin/holderbaum-werkbank.js <<'__WB_EOF__'
          #!/usr/bin/env node
          'use strict';

          // holderbaum-werkbank — legt eine Werkbank im aktuellen Ordner an.
          // Keine Abhängigkeiten. Überschreibt nie eine vorhandene Datei.

          const fs = require('fs');
          const path = require('path');

          const PKG = require('../package.json');
          const QUELLE = path.join(__dirname, '..', 'werkbank');
          const MARKER = '===== HOLDERBAUM-WERKSTATT · DATEI VOLLSTÄNDIG GELADEN =====';
          const WERKZEUGE = [
            ['Werkbank/Regeln/werkbank.md', 150],
            ['Werkbank/Rollen/Sparringpartner/SYSTEM.md', 150],
            ['Werkbank/Workflows/FORMAT.md', 100],
          ];

          function abbruch(text) {
            process.stderr.write('\nholderbaum-werkbank: ' + text + '\n\n');
            process.exit(1);
          }

          function hilfe() {
            process.stdout.write(
              'holderbaum-werkbank ' + PKG.version + '\n\n' +
              'Aufruf (im Ordner, der die Werkbank werden soll):\n' +
              '  npx holderbaum-werkbank@latest\n\n' +
              'Optionen:\n' +
              '  --dir <pfad>   Zielordner statt des aktuellen Ordners\n' +
              '  --en           Englische Fassung (noch nicht verfügbar)\n' +
              '  --version      Version ausgeben\n' +
              '  --help         Diese Hilfe\n\n' +
              'Quelle: ' + PKG.homepage + '\n'
            );
          }

          // Zeitstempel in Europe/Berlin, Format JJJJ-MM-TTTHH-MM-SS
          function zeitstempel() {
            const teile = new Intl.DateTimeFormat('de-DE', {
              timeZone: 'Europe/Berlin',
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit', second: '2-digit',
              hour12: false,
            }).formatToParts(new Date());
            const t = {};
            for (const p of teile) t[p.type] = p.value;
            return `${t.year}-${t.month}-${t.day}T${t.hour}-${t.minute}-${t.second}`;
          }

          function kopiere(von, nach, bericht) {
            for (const eintrag of fs.readdirSync(von, { withFileTypes: true })) {
              const a = path.join(von, eintrag.name);
              const b = path.join(nach, eintrag.name);
              if (eintrag.isDirectory()) {
                fs.mkdirSync(b, { recursive: true });
                kopiere(a, b, bericht);
              } else if (fs.existsSync(b)) {
                bericht.uebersprungen.push(b);
              } else {
                fs.copyFileSync(a, b);
                bericht.angelegt.push(b);
              }
            }
          }

          function pruefeWerkzeug(ziel, rel, minZeilen) {
            const datei = path.join(ziel, rel);
            if (!fs.existsSync(datei)) return rel + ': fehlt';
            const zeilen = fs.readFileSync(datei, 'utf8').split('\n');
            const inhalt = zeilen.filter((z) => z.trim() !== '');
            if (zeilen.length < minZeilen) return rel + ': nur ' + zeilen.length + ' Zeilen';
            if (inhalt[inhalt.length - 1] !== MARKER) return rel + ': End-Marker fehlt';
            return null;
          }

          function main() {
            const args = process.argv.slice(2);
            if (args.includes('--help') || args.includes('-h')) return hilfe();
            if (args.includes('--version') || args.includes('-v')) {
              return process.stdout.write(PKG.version + '\n');
            }
            if (args.includes('--en')) {
              abbruch('Die englische Fassung ist noch nicht verfügbar. Ohne --en starten.');
            }

            const i = args.indexOf('--dir');
            const ziel = path.resolve(i >= 0 && args[i + 1] ? args[i + 1] : process.cwd());

            // Schutz: Cowork startet Terminal-Befehle im Sandbox-Home, nicht im
            // Ordner des Nutzers. Dort darf keine Werkbank entstehen.
            if (/^\/sessions\/[^/]+\/?$/.test(ziel)) {
              abbruch(
                'Falscher Ordner: ' + ziel + ' ist das Sandbox-Verzeichnis, nicht der Ordner des Nutzers.\n' +
                'Wechsle mit cd in den verbundenen Ordner (unter ' + ziel.replace(/\/$/, '') + '/mnt/…) und starte erneut.'
              );
            }
            if (!fs.existsSync(ziel) || !fs.statSync(ziel).isDirectory()) {
              abbruch('Zielordner existiert nicht: ' + ziel);
            }
            try {
              fs.accessSync(ziel, fs.constants.W_OK);
            } catch (e) {
              abbruch('Kein Schreibrecht im Zielordner: ' + ziel);
            }

            const stempel = zeitstempel();
            const laufRel = path.join('Werkbank', 'protokolle', 'werkbank-setup-' + stempel);
            const lauf = path.join(ziel, laufRel);
            const bericht = { angelegt: [], uebersprungen: [] };

            // Schritt 1: Verzeichnisse
            for (const d of [
              'Werkbank/Regeln', 'Werkbank/Rollen/Sparringpartner', 'Werkbank/Workflows',
              path.join(laufRel, 'kladde'), 'Quellen/unterlagen', 'Quellen/website', 'Projekte',
            ]) {
              fs.mkdirSync(path.join(ziel, d), { recursive: true });
            }

            // Schritt 2: Werkzeuge (SETUP.md kommt in den Lauf-Ordner, nicht ins Root)
            const de = path.join(QUELLE, 'de');
            kopiere(path.join(de, 'Werkbank'), path.join(ziel, 'Werkbank'), bericht);
            fs.copyFileSync(path.join(de, 'SETUP.md'), path.join(lauf, 'SETUP.md'));

            const fehler = WERKZEUGE.map(([rel, n]) => pruefeWerkzeug(ziel, rel, n)).filter(Boolean);
            if (fehler.length) {
              abbruch('Werkzeuge unvollständig:\n  ' + fehler.join('\n  ') + '\nNichts zusammenraten — Paket neu ausführen.');
            }

            const zeilenzahl = (rel) => fs.readFileSync(path.join(ziel, rel), 'utf8').replace(/\n$/, '').split('\n').length;
            fs.writeFileSync(path.join(lauf, 'lauf.md'),
              '# Lauf werkbank-setup-' + stempel + '\n' +
              '- Paket: holderbaum-werkbank ' + PKG.version + ' (Bauanleitung v4.0)\n' +
              '- Start: ' + stempel + '\n' +
              '- Schritte:\n' +
              '  - Schritt 1, ' + stempel + ': Verzeichnisse angelegt (Paket)\n' +
              '  - Schritt 2, ' + stempel + ': Werkzeuge ' +
                WERKZEUGE.map(([rel]) => path.basename(path.dirname(rel)) + '/' + path.basename(rel) + ' (' + zeilenzahl(rel) + ' Zeilen)').join(', ') +
                (bericht.uebersprungen.length ? '; vorhanden und nicht überschrieben: ' + bericht.uebersprungen.map((p) => path.relative(ziel, p)).join(', ') : '') +
                '\n'
            );

            const setupRel = path.join(laufRel, 'SETUP.md');
            process.stdout.write(
              'Werkbank-Gerüst angelegt in: ' + ziel + '\n' +
              'Paket holderbaum-werkbank ' + PKG.version + ' · Werkzeuge v4.0 vollständig\n' +
              (bericht.uebersprungen.length
                ? 'Vorhanden, nicht überschrieben: ' + bericht.uebersprungen.map((p) => path.relative(ziel, p)).join(', ') + '\n'
                : '') +
              '\n' +
              'NÄCHSTER SCHRITT FÜR DEN AGENTEN:\n' +
              'Lies ' + setupRel + ' (relativ zu diesem Ordner) vollständig mit dem Read-Tool\n' +
              'und folge der Anleitung ab SCHRITT 3. Der Nutzer muss nichts tun.\n'
            );
          }

          main();
          __WB_EOF__
          cat > test/smoke.js <<'__WB_EOF__'
          'use strict';
          // Rauchtest: Installation in leeren Ordner, zweiter Lauf überschreibt nichts.
          const { execFileSync } = require('child_process');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const assert = require('assert');

          const bin = path.join(__dirname, '..', 'bin', 'holderbaum-werkbank.js');
          const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'werkbank-test-'));

          const out1 = execFileSync('node', [bin], { cwd: tmp, encoding: 'utf8' });
          assert.match(out1, /NÄCHSTER SCHRITT/);
          for (const f of ['Werkbank/Regeln/werkbank.md', 'Werkbank/Rollen/Sparringpartner/SYSTEM.md', 'Werkbank/Workflows/FORMAT.md']) {
            assert.ok(fs.existsSync(path.join(tmp, f)), f + ' fehlt');
          }
          for (const d of ['Quellen/unterlagen', 'Quellen/website', 'Projekte']) {
            assert.ok(fs.statSync(path.join(tmp, d)).isDirectory(), d + ' fehlt');
          }
          const laeufe = fs.readdirSync(path.join(tmp, 'Werkbank/protokolle'));
          assert.strictEqual(laeufe.length, 1);
          assert.match(laeufe[0], /^werkbank-setup-\d{4}-\d\d-\d\dT\d\d-\d\d-\d\d$/);
          const lauf = path.join(tmp, 'Werkbank/protokolle', laeufe[0]);
          assert.ok(fs.existsSync(path.join(lauf, 'SETUP.md')));
          assert.ok(fs.existsSync(path.join(lauf, 'lauf.md')));
          assert.ok(fs.statSync(path.join(lauf, 'kladde')).isDirectory());
          assert.ok(!fs.existsSync(path.join(tmp, 'KONTEXT.md')), 'KONTEXT.md darf das Paket nicht anlegen');

          // Zweiter Lauf: eigene Änderung bleibt erhalten
          const regel = path.join(tmp, 'Werkbank/Regeln/werkbank.md');
          fs.writeFileSync(path.join(tmp, 'KONTEXT.md'), '# Meine KONTEXT\n');
          const inhalt = fs.readFileSync(path.join(__dirname, '..', 'werkbank/de/Werkbank/Regeln/werkbank.md'), 'utf8');
          fs.writeFileSync(regel, inhalt.replace('# ', '# <!-- eigene Ergänzung --> '));
          const out2 = execFileSync('node', [bin], { cwd: tmp, encoding: 'utf8' });
          assert.match(out2, /nicht überschrieben/);
          assert.match(fs.readFileSync(regel, 'utf8'), /eigene Ergänzung/);
          assert.strictEqual(fs.readFileSync(path.join(tmp, 'KONTEXT.md'), 'utf8'), '# Meine KONTEXT\n');

          // --version, --help
          assert.strictEqual(execFileSync('node', [bin, '--version'], { encoding: 'utf8' }).trim(), require('../package.json').version);
          assert.match(execFileSync('node', [bin, '--help'], { encoding: 'utf8' }), /npx holderbaum-werkbank@latest/);

          fs.rmSync(tmp, { recursive: true, force: true });
          console.log('smoke: ok');
          __WB_EOF__
          cat > README.md <<'__WB_EOF__'
          # Werkbank

          Die Werkbank ist ein strukturiertes Verzeichnis, in dem ein Mensch mit KI-Agenten arbeitet: eine `KONTEXT.md` als Schild an der Wand, dazu Regeln, Rollen und Workflows. Gedacht für Claude Cowork.

          Mehr zur Idee: [holderbaum.io](https://holderbaum.io)

          ## Einrichten

          Ordner in Cowork verbinden, neue Session starten, diesen Text hineinkopieren:

          ```
          Hallo! Ich möchte in diesem Ordner meine Werkbank einrichten. Das ist eine
          Arbeitsumgebung, in der wir beide gut zusammenarbeiten können.

          Lade sie bitte herunter und folge der Anleitung, die dabei ist. Wenn du etwas
          von mir brauchst, frag mich einfach.

          ---
          Für den Agenten:
          npx holderbaum-werkbank@latest
          ```

          Der Agent legt das Gerüst an, sammelt Material über dich ein (Website, Unterlagen, ChatGPT-/Claude-Gedächtnis) und baut daraus deine `KONTEXT.md`. Am Ende zeigt er zwei kurze Textblöcke, die du selbst in deine Claude-Einstellungen kopierst.

          ## Was das Paket tut

          - legt `Werkbank/`, `Quellen/` und `Projekte/` im aktuellen Ordner an
          - kopiert drei Werkzeuge: Werkbank-Regel, Sparringpartner, Workflow-Format
          - überschreibt keine vorhandene Datei
          - legt die Setup-Anleitung in `Werkbank/protokolle/werkbank-setup-<Zeitstempel>/SETUP.md`
          - hat keine Abhängigkeiten und lädt nichts nach

          Der Inhalt liegt offen in [`werkbank/de/`](werkbank/de/).

          ## Für den Agenten: wenn etwas schiefgeht

          - **Befehl lief im falschen Ordner:** Cowork startet Terminal-Befehle im Sandbox-Verzeichnis. Vorher mit `cd` in den verbundenen Ordner des Nutzers wechseln (unter `/sessions/<id>/mnt/<Ordner>`).
          - **npm nicht erreichbar:** Dem Nutzer die Fehlermeldung zeigen. Nichts zusammenraten, keine Datei aus dem Gedächtnis schreiben.

          ## Releases

          Ein Tag `vX.Y.Z` auf `main` veröffentlicht das Paket per GitHub Action auf npm (`.github/workflows/release.yml`). Die Version in `package.json` muss zum Tag passen. `npm test` prüft die Installation in einem leeren und einem befüllten Ordner.

          ## Lizenz

          MIT
          __WB_EOF__
